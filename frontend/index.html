<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LanguageCRM</title>
    <style>
      body {
        background-color: black;
        margin: 0;
      }
      .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px 16px;
        box-sizing: border-box;
      }
      .title {
        font-family: Arial, Helvetica, sans-serif;
        color: white;
        text-align: center;
      }
      .input-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-bottom: 20px;
      }
      #promptInput {
        flex: 1 1 260px;
        min-width: 0;
        padding: 12px;
        font-size: 16px;
        box-sizing: border-box;
      }
      #sendBtn {
        padding: 12px 24px;
        font-size: 16px;
      }
      #sendBtn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #chatLog {
        font-family: Arial, Helvetica, sans-serif;
        color: white;
        text-align: left;
      }
      #chatLog p {
        margin: 4px 0;
        overflow-wrap: break-word;
      }
      .user-message {
        color: #8ab4f8;
      }
      .bot-message {
        color: white;
      }
      .loading-message {
        color: #999999;
      }
      .error-message {
        color: #f28b82;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="title">LanguageCRM - Natural Language Interface</h1>
      <div class="input-row">
        <input id="promptInput" type="text" placeholder="Ex: Add client John..." />
        <button id="sendBtn" disabled>Send</button>
      </div>
      <div id="chatLog"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
