<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LanguageCRM</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background-color: black;
      }
      .container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 700px;
        margin: 0 auto;
        padding: 20px 16px;
        box-sizing: border-box;
      }
      .title {
        flex-shrink: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
        text-align: center;
        margin: 0 0 16px;
      }
      #chatLog {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #111111;
        border: 1px solid #333333;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .message-row {
        display: flex;
      }
      .message-row.user {
        justify-content: flex-end;
      }
      .message-row.bot {
        justify-content: flex-start;
      }
      .bubble {
        max-width: 75%;
        padding: 10px 14px;
        border-radius: 16px;
        font-family: Arial, Helvetica, sans-serif;
        overflow-wrap: break-word;
      }
      .bubble-user {
        background: #8ab4f8;
        color: #0b1a33;
        border-bottom-right-radius: 4px;
      }
      .bubble-bot {
        background: #2a2a2a;
        color: white;
        border-bottom-left-radius: 4px;
      }
      .bubble-loading {
        background: #2a2a2a;
        color: #999999;
        font-style: italic;
        border-bottom-left-radius: 4px;
      }
      .bubble-error {
        background: #4a2020;
        color: #f28b82;
        border-bottom-left-radius: 4px;
      }
      .input-row {
        flex-shrink: 0;
        display: flex;
        gap: 8px;
      }
      #promptInput {
        flex: 1;
        min-width: 0;
        padding: 12px 16px;
        font-size: 16px;
        border-radius: 24px;
        border: 1px solid #444444;
        background: #1a1a1a;
        color: white;
        box-sizing: border-box;
      }
      #sendBtn {
        padding: 12px 20px;
        font-size: 16px;
        border-radius: 24px;
        border: none;
        background: #8ab4f8;
        color: #0b1a33;
        cursor: pointer;
      }
      #sendBtn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="title">LanguageCRM - Natural Language Interface</h1>
      <div id="chatLog"></div>
      <div class="input-row">
        <input id="promptInput" type="text" placeholder="Ex: Add client John..." />
        <button id="sendBtn" disabled>Send</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
