name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run pytest with coverage
        run: uv run --frozen --extra dev pytest --cov=app --cov-report=term --cov-report=json:coverage.json

      - name: Extract coverage percentage
        id: cov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python -c "
          import json, os
          pct = round(json.load(open('coverage.json'))['totals']['percent_covered'])
          color = 'brightgreen' if pct >= 80 else ('yellow' if pct >= 60 else 'red')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'pct={pct}\ncolor={color}\n')
          "

      - name: Update coverage badge Gist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.GIST_SECRET != '' && (secrets.COVERAGE_GIST_ID != '' || vars.COVERAGE_GIST_ID != '')
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.COVERAGE_GIST_ID || vars.COVERAGE_GIST_ID }}
          filename: languagecrm-coverage.json
          label: coverage
          message: ${{ steps.cov.outputs.pct }}%
          color: ${{ steps.cov.outputs.color }}

  frontend:
    name: Frontend build (tsc & vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build
